<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song 1 - Our Special Track 🎵</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw;
            height: 100vh;
            background-image: url('Song1_card.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #ffd6e0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            padding-bottom: 20px;
            overflow: hidden;
        }
        .player-container {
            width: 85%;
            max-width: 280px;
            background-color: rgba(255, 255, 255, 0.88);
            border: 2px solid #800f30;
            border-radius: 16px;
            padding: 12px 15px;
            box-shadow: 0 4px 15px rgba(128, 15, 48, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        .progress-box { width: 100%; margin-bottom: 8px; }
        .progress-bar-bg { width: 100%; height: 5px; background-color: #ffd6e0; border-radius: 10px; overflow: hidden; cursor: pointer; }
        .progress-bar-fill { width: 0%; height: 100%; background-color: #800f30; border-radius: 10px; transition: width 0.1s linear; }
        .time-labels { display: flex; justify-content: space-between; font-size: 10px; color: #800f30; font-weight: 500; margin-top: 3px; }
        .controls-row { display: flex; align-items: center; justify-content: center; gap: 15px; width: 100%; }
        .dummy-btn { background: none; border: none; color: #800f30; font-size: 18px; cursor: pointer; opacity: 0.8; }
        .play-btn {
            width: 42px; height: 42px; border-radius: 50%; background-color: #800f30; color: #ffffff;
            border: none; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 3px 10px rgba(128, 15, 48, 0.3);
        }
        .back-link {
            margin-top: 8px;
            color: #800f30;
            font-size: 11px;
            text-decoration: none;
            font-weight: 600;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 3px 10px;
            border-radius: 8px;
            border: 1px solid rgba(128, 15, 48, 0.2);
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <audio id="myAudio" src="Song1.mp3"></audio>

    <div class="player-container">
        <div class="progress-box">
            <div class="progress-bar-bg" onclick="seekAudio(event)">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="time-labels">
                <span id="currentTime">0:00</span>
                <span id="durationTime">0:00</span>
            </div>
        </div>
        <div class="controls-row">
            <button class="dummy-btn">⏮️</button>
            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
            <button class="dummy-btn">⏭️</button>
        </div>
    </div>

    <a href="page3.html" class="back-link">← Back to Songs</a>

    <script>
        const audio = document.getElementById('myAudio');
        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        function togglePlay() {
            if (audio.paused) { audio.play(); playBtn.innerText = "❚❚"; }
            else { audio.pause(); playBtn.innerText = "▶"; }
        }
        function formatTime(seconds) {
            let min = Math.floor(seconds / 60);
            let sec = Math.floor(seconds % 60);
            if (sec < 10) sec = "0" + sec;
            return min + ":" + sec;
        }
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                progressFill.style.width = (audio.currentTime / audio.duration) * 100 + "%";
                currentTimeEl.innerText = formatTime(audio.currentTime);
                durationTimeEl.innerText = formatTime(audio.duration);
            }
        });
        function seekAudio(event) {
            const clickX = event.offsetX;
            const totalWidth = event.currentTarget.clientWidth;
            if (audio.duration) { audio.currentTime = (clickX / totalWidth) * audio.duration; }
        }
        audio.addEventListener('ended', () => { playBtn.innerText = "▶"; progressFill.style.width = "0%"; });
    </script>
</body>
</html>
