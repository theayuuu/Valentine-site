<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song 3 - Can't help falling in love 🎵</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw;
            min-height: 100vh;
            background-color: #2b1215;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .card-wrapper {
            width: 100%;
            max-width: 280px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            background-color: #1a090b;
        }
        .card-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }
        .song-info {
            width: 100%;
            max-width: 280px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }
        .song-text h2 {
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .song-text p {
            color: #b3b3b3;
            font-size: 12px;
        }
        .heart-icon {
            font-size: 22px;
            cursor: pointer;
            color: #800f30;
        }
        .player-box {
            width: 100%;
            max-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        /* Native audio player ko thoda neat dikhane ke liye */
        audio {
            width: 100%;
            margin-top: 5px;
        }
        .back-link {
            margin-top: 15px;
            color: #b3b3b3;
            font-size: 12px;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card-wrapper">
            <img src="Song3_pic.jpg" alt="Song 3 Cover">
        </div>

        <div class="song-info">
            <div class="song-text">
                <h2>Can't help falling in love</h2>
                <p>Our Special Track</p>
            </div>
            <div class="heart-icon">❤️</div>
        </div>

        <!-- Yahan controls on kar diye hain taaki direct pata chale -->
        <audio id="myAudio" src="track_three.mp3" controls preload="auto"></audio>

        <a href="page3.html" class="back-link">← Back to Songs</a>
    </div>
</body>
</html>
