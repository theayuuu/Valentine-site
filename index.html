<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Happy Valentines 💕</title>
    
    <!-- Google Fonts: Great Vibes Calligraphy Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        body {
            background-color: #800f30;
            background-image: url('bg-page1.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
            gap: 20px;
        }

        .top-header {
            font-family: 'Great Vibes', cursive;
            font-size: 52px;
            color: #ffe6eb;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            font-weight: normal;
            line-height: 1;
        }

        .bottom-section {
            width: 100%;
            max-width: 360px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sub-header {
            font-size: 13px;
            font-weight: 500;
            color: #ffccd5;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        .subtitle {
            font-size: 14px;
            font-weight: 400;
            color: #fff0f3;
            line-height: 1.5;
            margin-bottom: 20px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            position: relative;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 110px;
            height: 48px;
            background-color: rgba(128, 15, 48, 0.75);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn-yes:active {
            transform: scale(0.95);
            background-color: rgba(128, 15, 48, 0.95);
        }

        .btn-no {
            touch-action: none;
            user-select: none;
        }
    </style>
</head>
<body> 

    <!-- Mark 1 Section -->
    <h1 class="top-header">Happy valentines!</h1>

    <!-- Mark 2 Section -->
    <div class="bottom-section">
        <div class="sub-header">My khutur babiee😚</div>
        <p class="subtitle">I have made something for you.<br>Are you ready to see 🙈 this?</p>

        <div class="btn-container">
            <a href="page2.html" class="btn btn-yes" id="yesBtn">Yes</a>
            <button class="btn btn-no" id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');

        function dodgeButton() {
            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
            noBtn.style.zIndex = '999';
        }

        noBtn.addEventListener('mouseover', dodgeButton);
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            dodgeButton();
        });
        noBtn.addEventListener('click', function(e) {
            e.preventDefault();
            dodgeButton();
        });
    </script>
</body>
</html>
