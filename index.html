
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Valentines 💕</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      height: 100vh;
      height: 100dvh;
      width: 100%;

      /* Original background — unchanged */
      background-color: #a96e77;
      background-image: url('./Bg3-page1.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: 100% 100%;

      position: relative;
      font-family: Arial, sans-serif;
    }

    /* Original button placement */
    .btn-container {
      position: absolute;
      left: 50%;
      bottom: 9%;
      transform: translateX(-50%);

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;

      width: max-content;
      max-width: 100%;
    }

    /* Original button design */
    .btn {
      width: 110px;
      height: 48px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(105, 13, 45, 0.88);
      color: #fff0f4;

      border: 1px solid rgba(255, 210, 220, 0.8);
      border-radius: 10px;

      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;

      box-shadow: 0 4px 12px rgba(75, 0, 25, 0.16);
      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .btn-yes:active {
      transform: scale(0.96);
    }

    .btn-no {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    @media (max-width: 360px) {
      .btn-container {
        gap: 12px;
      }

      .btn {
        width: 100px;
        height: 44px;
      }
    }
  </style>
</head>

<body>

  <!-- Yes and No buttons only; no extra visible box -->
  <div class="btn-container" id="buttonContainer">

    <a href="page2.html" class="btn btn-yes">
      Yes
    </a>

    <button type="button" class="btn btn-no" id="noBtn">
      No
    </button>

  </div>

  <script>
    const noBtn = document.getElementById('noBtn');

    function dodgeButton(event) {
      if (event) {
        event.preventDefault();
      }

      const padding = 16;
      const buttonWidth = noBtn.offsetWidth;
      const buttonHeight = noBtn.offsetHeight;

      // Available visible screen area
      const screenWidth = document.documentElement.clientWidth;
      const screenHeight = document.documentElement.clientHeight;

      const maxX = Math.max(
        padding,
        screenWidth - buttonWidth - padding
      );

      const maxY = Math.max(
        padding,
        screenHeight - buttonHeight - padding
      );

      // Random position inside the screen
      const x = padding + Math.random() * (maxX - padding);
      const y = padding + Math.random() * (maxY - padding);

      // Move only No; keep the rest of the page unchanged
      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      noBtn.style.right = 'auto';
      noBtn.style.bottom = 'auto';
      noBtn.style.margin = '0';
      noBtn.style.transform = 'none';
      noBtn.style.zIndex = '9999';
    }

    // Desktop: dodge when the pointer approaches
    noBtn.addEventListener('mouseenter', dodgeButton);

    // Mobile: dodge when touched
    noBtn.addEventListener('touchstart', dodgeButton, {
      passive: false
    });

    // Fallback for clicks
    noBtn.addEventListener('click', dodgeButton);
  </script>

</body>
</html>
