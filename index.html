<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Valentines 💕</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      /* Your complete background image with all text */
      background-color: #8e3448;
      background-image: url('./Bg2page1.jpg');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: contain;

      display: flex;
      justify-content: center;
      align-items: flex-end;

      position: relative;
    }

    /* Buttons placed below your existing text */
    .btn-container {
      position: absolute;
      left: 50%;
      bottom: 11%;
      transform: translateX(-50%);

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;

      width: max-content;
      max-width: 100%;
      padding: 8px;
    }

    .btn {
      width: 110px;
      height: 48px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255, 210, 220, 0.75);
      border-radius: 10px;

      background: rgba(91, 9, 34, 0.78);
      color: #fff1f4;

      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;

      box-shadow: 0 4px 14px rgba(60, 0, 20, 0.18);
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }

    .btn-yes:active {
      transform: scale(0.96);
      background: rgba(91, 9, 34, 0.95);
    }

    .btn-no {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    @media (max-width: 360px) {
      .btn-container {
        gap: 12px;
      }

      .btn {
        width: 100px;
        height: 44px;
      }
    }
  </style>
</head>

<body>

  <div class="btn-container" id="buttonContainer">
    <a href="page2.html" class="btn btn-yes">Yes</a>
    <button type="button" class="btn btn-no" id="noBtn">No</button>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');

    function dodgeButton() {
      const padding = 16;

      const maxX = Math.max(
        padding,
        window.innerWidth - noBtn.offsetWidth - padding
      );

      const maxY = Math.max(
        padding,
        window.innerHeight - noBtn.offsetHeight - padding
      );

      const x = padding + Math.random() * (maxX - padding);
      const y = padding + Math.random() * (maxY - padding);

      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      noBtn.style.zIndex = '1000';
    }

    noBtn.addEventListener('mouseenter', dodgeButton);

    noBtn.addEventListener('touchstart', function(event) {
      event.preventDefault();
      dodgeButton();
    }, { passive: false });

    noBtn.addEventListener('click', function(event) {
      event.preventDefault();
      dodgeButton();
    });
  </script>

</body>
</html>
