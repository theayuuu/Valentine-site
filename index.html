<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Valentines 💕</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      height: 100vh;
      height: 100dvh;
      width: 100%;

      /* Exact image filename from GitHub */
      background-color: #a96e77;
      background-image: url('./Bg3-page1.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: 100% 100%;

      position: relative;
      font-family: Arial, sans-serif;
    }

    /* Buttons only — no visible container or box */

    .btn-container {
      position: absolute;
      left: 50%;
      bottom: 9%;
      transform: translateX(-50%);

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;

      width: max-content;
      max-width: 100%;
    }

    .btn {
      width: 110px;
      height: 48px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(105, 13, 45, 0.88);
      color: #fff0f4;

      border: 1px solid rgba(255, 210, 220, 0.8);
      border-radius: 10px;

      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;

      box-shadow: 0 4px 12px rgba(75, 0, 25, 0.16);
      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .btn-yes:active {
      transform: scale(0.96);
    }

    .btn-no {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    @media (max-width: 360px) {
      .btn-container {
        gap: 12px;
      }

      .btn {
        width: 100px;
        height: 44px;
      }
    }
  </style>
</head>

<body>

  <!-- Only two buttons -->
  <div class="btn-container">

    <a href="page2.html" class="btn btn-yes">
      Yes
    </a>

    <button type="button" class="btn btn-no" id="noBtn">
      No
    </button>

  </div>

  <!-- No button dodging effect -->
  <script>
    const noBtn = document.getElementById('noBtn');

    function dodgeButton() {
      const padding = 16;

      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const x = padding + Math.random() * Math.max(0, maxX - padding);
      const y = padding + Math.random() * Math.max(0, maxY - padding);

      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      noBtn.style.zIndex = '1000';
    }

    noBtn.addEventListener('mouseenter', dodgeButton);

    noBtn.addEventListener('touchstart', function(event) {
      event.preventDefault();
      dodgeButton();
    }, { passive: false });

    noBtn.addEventListener('click', function(event) {
      event.preventDefault();
      dodgeButton();
    });
  </script>

</body>
</html>
