<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Happy Valentines 💕</title>
    
    <!-- Google Fonts: Great Vibes for Calligraphy Style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        body {
            /* Exact Heart Aura Aesthetic Background Gradient */
            background: radial-gradient(circle at center, #8a2be2 0%, #b8336a 25%, #7a1c31 60%, #420816 100%);
            background: radial-gradient(circle at center, #d9536e 0%, #a8324f 30%, #6e172e 70%, #3d0714 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 360px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Top Header (Mark 1) in Reference Calligraphy Font */
        .top-header {
            font-family: 'Great Vibes', cursive;
            font-size: 58px;
            color: #ffe6eb;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
            line-height: 1.1;
            margin-bottom: 8px;
            font-weight: normal;
        }

        /* Sub-header in Minimal Mini Font */
        .sub-header {
            font-size: 13px;
            font-weight: 500;
            color: #ffccd5;
            letter-spacing: 0.8px;
            margin-bottom: 18px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        /* Subtitle Message */
        .subtitle {
            font-size: 14px;
            font-weight: 400;
            color: #fff0f3;
            line-height: 1.5;
            margin-bottom: 35px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        /* Square Button Container (Mark 2) */
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            position: relative;
        }

        /* Beautiful Matching Button Style */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 110px;
            height: 48px;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn-yes:active {
            transform: scale(0.95);
            background-color: rgba(255, 133, 161, 0.4);
        }

        /* Dodging 'No' Button */
        .btn-no {
            touch-action: none;
            user-select: none;
        }
    </style>
</head>
<body> 

    <div class="container">
        <!-- Mark 1: Top Header in Calligraphy Font -->
        <h1 class="top-header">Happy valentines!</h1>
        
        <!-- Sub-header -->
        <div class="sub-header">My khutur babiee😚</div>
        
        <!-- Subtitle -->
        <p class="subtitle">I have made something for you.<br>Are you ready to see 🙈 this?</p>

        <!-- Mark 2: Buttons Container -->
        <div class="btn-container">
            <a href="page2.html" class="btn btn-yes" id="yesBtn">Yes</a>
            <button class="btn btn-no" id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');

        function dodgeButton() {
            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
            noBtn.style.zIndex = '999';
        }

        // Desktop hover trigger
        noBtn.addEventListener('mouseover', dodgeButton);
        
        // Mobile touch trigger
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            dodgeButton();
        });

        // Click fallback
        noBtn.addEventListener('click', function(e) {
            e.preventDefault();
            dodgeButton();
        });
    </script>
</body>
</html>
