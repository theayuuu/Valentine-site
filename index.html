
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Happy Valentines 💕</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            background-color: #800f30;
            background-image: url('bg-page1.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;

            font-family: 'Poppins', sans-serif;

            padding: 35px 20px 40px;
            gap: 20px;
        }

        /* TOP: Happy valentines! */

        .top-header {
            font-family: 'Parisienne', cursive;
            font-size: clamp(38px, 7vw, 52px);
            font-weight: normal;
            line-height: 1.2;

            color: #800f30;
            text-shadow: none;

            text-align: center;
            white-space: nowrap;
            flex-shrink: 0;
            margin-top: 0;
        }

        /* BOTTOM: Message and buttons */

        .bottom-section {
            width: 100%;
            max-width: 360px;

            text-align: center;

            display: flex;
            flex-direction: column;
            align-items: center;

            flex-shrink: 0;
            margin-bottom: 0;
        }

        .sub-header {
            font-size: 13px;
            font-weight: 500;
            color: #ffccd5;
            letter-spacing: 0.8px;

            margin-bottom: 10px;

            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        .subtitle {
            font-size: 14px;
            font-weight: 400;
            color: #fff0f3;
            line-height: 1.5;

            margin-bottom: 20px;

            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        /* BUTTONS */

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            position: relative;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 110px;
            height: 48px;

            background-color: rgba(128, 15, 48, 0.75);
            backdrop-filter: blur(8px);

            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 500;

            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;

            text-decoration: none;
            cursor: pointer;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);

            transition:
                transform 0.1s ease,
                background-color 0.2s ease;
        }

        .btn-yes:active {
            transform: scale(0.95);
            background-color: rgba(128, 15, 48, 0.95);
        }

        .btn-no {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Smaller screens */

        @media (max-height: 600px) {
            body {
                padding-top: 20px;
                padding-bottom: 20px;
                gap: 12px;
            }

            .top-header {
                font-size: clamp(34px, 6vw, 44px);
            }

            .subtitle {
                margin-bottom: 12px;
            }
        }

        @media (max-width: 360px) {
            body {
                padding-left: 12px;
                padding-right: 12px;
            }

            .top-header {
                font-size: 36px;
            }

            .btn-container {
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- MARK 1: TOP HEADING -->

    <h1 class="top-header">Happy valentines!</h1>


    <!-- MARK 2: BOTTOM CONTENT -->

    <div class="bottom-section">

        <div class="sub-header">My khutur babiee😚</div>

        <p class="subtitle">
            I have made something for you.<br>
            Are you ready to see 🙈 this?
        </p>

        <div class="btn-container">

            <!-- YES BUTTON: OPENS PAGE 2 -->

            <a href="page2.html" class="btn btn-yes" id="yesBtn">
                Yes
            </a>

            <!-- NO BUTTON: DODGES THE USER -->

            <button type="button" class="btn btn-no" id="noBtn">
                No
            </button>

        </div>
    </div>


    <!-- DODGING BUTTON EFFECT -->

    <script>
        const noBtn = document.getElementById('noBtn');

        function dodgeButton() {
            const padding = 20;

            const maxX = Math.max(
                padding,
                window.innerWidth - noBtn.offsetWidth - padding
            );

            const maxY = Math.max(
                padding,
                window.innerHeight - noBtn.offsetHeight - padding
            );

            const randomX = Math.floor(
                Math.random() * (maxX - padding + 1) + padding
            );

            const randomY = Math.floor(
                Math.random() * (maxY - padding + 1) + padding
            );

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.style.zIndex = '999';
        }

        // Dodges on desktop hover
        noBtn.addEventListener('mouseover', dodgeButton);

        // Dodges on mobile touch
        noBtn.addEventListener('touchstart', function(event) {
            event.preventDefault();
            dodgeButton();
        }, { passive: false });

        // Dodges on click
        noBtn.addEventListener('click', function(event) {
            event.preventDefault();
            dodgeButton();
        });
    </script>

</body>
</html>
