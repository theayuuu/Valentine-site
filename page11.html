<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recharge Station - Page 11 🤎</title>
    <!-- Google Font: Clean Minimalist Sans-serif / Inter style -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        body {
            background-color: #8c2848;
            background-image: url('./Bg1-page10.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
            position: relative;
        }

        /* Top Battery & Percentage (Red area) */
        .battery-top-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .battery-outer {
            width: 65px;
            height: 26px;
            border: 2px solid #fff5f7;
            border-radius: 6px;
            padding: 2px;
            position: relative;
            background: rgba(0, 0, 0, 0.2);
        }

        .battery-outer::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 7px;
            width: 3px;
            height: 8px;
            background: #fff5f7;
            border-radius: 0 2px 2px 0;
        }

        .battery-inner {
            height: 100%;
            width: 0%;
            background: #ff6b6b;
            border-radius: 3px;
            transition: width 0.6s ease;
        }

        .battery-perc {
            font-size: 15px;
            font-weight: 600;
            color: #fff5f7;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Subtitle Text (Yellow area) */
        .instruction-text {
            color: #fff5f7;
            font-size: 14px;
            line-height: 1.5;
            font-weight: 500;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Buttons Container */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 340px;
            align-items: center;
        }

        .row-btns {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        /* Green area buttons (Food & Water) */
        .square-btn {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #4a151b;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            padding: 16px 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        }

        .square-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px);
        }

        .half-width {
            flex: 1;
            height: 110px;
        }

        /* Purple area button (Love & Kisses) */
        .full-width {
            width: 100%;
            height: 75px;
            background: rgba(74, 21, 27, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff5f7;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 18px;
            padding: 12px 18px;
            font-family: 'Poppins', sans-serif;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            opacity: 0.4;
            pointer-events: none; /* Locked until 50% charged */
        }

        .full-width.unlocked {
            opacity: 1;
            pointer-events: auto;
            animation: pulseGlow 1.5s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* Emoji Rain Styling */
        .falling-emoji {
            position: absolute;
            top: -30px;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            z-index: 10;
            animation: fallAnimation linear forwards;
        }

        @keyframes fallAnimation {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.8;
            }
        }
    </style>
</head>
<body>

    <!-- Red Area: Battery & Percentage -->
    <div class="battery-top-wrapper">
        <div class="battery-outer">
            <div class="battery-inner" id="batteryInner"></div>
        </div>
        <div class="battery-perc" id="batteryPerc">0%</div>
    </div>

    <!-- Yellow Area: Minimal Clean Text -->
    <div class="instruction-text">
        Khutur baby is tired.<br>Click the buttons to get recharged.
    </div>

    <!-- Buttons Layout -->
    <div class="buttons-container">
        <!-- Green Area: Food & Water Buttons -->
        <div class="row-btns">
            <button class="square-btn half-width" onclick="handleFoodClick()">
                <span style="font-size: 20px;">🍕</span>
                <span>Have some food baby 😋</span>
            </button>
            <button class="square-btn half-width" onclick="handleWaterClick()">
                <span style="font-size: 20px;">🥤</span>
                <span>Have some water baby 🥤</span>
            </button>
        </div>
        
        <!-- Purple Area: Final Love Button -->
        <button class="square-btn full-width" id="loveBtn" onclick="handleLoveClick()">
            <span style="font-size: 20px;">🫂💋</span>
            <span>Get putur kisses, hugs and love to fully recharge</span>
        </button>
    </div>

    <script>
        let currentPercentage = 0;
        let foodClickedOnce = false;
        let waterClickedOnce = false;

        function triggerEmojiRain(emojiArray) {
            const duration = 3000;
            const intervalTime = 100;
            const endTime = Date.now() + duration;

            const rainInterval = setInterval(() => {
                if (Date.now() > endTime) {
                    clearInterval(rainInterval);
                    return;
                }

                const emojiSpan = document.createElement('div');
                emojiSpan.classList.add('falling-emoji');
                
                const randomEmoji = emojiArray[Math.floor(Math.random() * emojiArray.length)];
                emojiSpan.innerText = randomEmoji;

                emojiSpan.style.left = Math.random() * window.innerWidth + 'px';
                
                const fallDuration = Math.random() * 1 + 1.5;
                emojiSpan.style.animationDuration = fallDuration + 's';

                document.body.appendChild(emojiSpan);

                setTimeout(() => {
                    emojiSpan.remove();
                }, fallDuration * 1000);

            }, intervalTime);
        }

        function handleFoodClick() {
            triggerEmojiRain(['🍔', '🥪', '🍕', '🥯']);

            if (!foodClickedOnce) {
                foodClickedOnce = true;
                currentPercentage += 25;
                updateBatteryDisplay();
            }
        }

        function handleWaterClick() {
            triggerEmojiRain(['💧']);

            if (!waterClickedOnce) {
                waterClickedOnce = true;
                currentPercentage += 25;
                updateBatteryDisplay();
            }
        }

        function updateBatteryDisplay() {
            const innerBar = document.getElementById('batteryInner');
            const percText = document.getElementById('batteryPerc');
            const loveBtn = document.getElementById('loveBtn');

            innerBar.style.width = currentPercentage + '%';
            percText.innerText = currentPercentage + '%';

            if (currentPercentage >= 50) {
                loveBtn.classList.add('unlocked');
            }
        }

        function handleLoveClick() {
            window.location.href = 'page12.html';
        }
    </script>

</body>
</html>
