<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Valentine's - Page 15 🤎</title>
    <!-- Google Font: Clean Minimalist Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #8c2848;
            background-image: url('./Bg1-page14.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Center Container Box */
        .final-card {
            position: relative;
            width: 90%;
            max-width: 340px;
            background: rgba(255, 245, 247, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(74, 21, 27, 0.3);
            border-radius: 24px;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: popUpModal 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUpModal {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Large Sticker in Center */
        .center-sticker {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.15));
        }

        /* Minimalist Text */
        .valentine-text {
            color: #4a151b;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Final Center Card -->
    <div class="final-card">
        <img src="./sticker.jpg" alt="Valentine Sticker" class="center-sticker">
        <div class="valentine-text">
            happy valentines 💌
        </div>
    </div>

</body>
</html>
