<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me? 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            /* Full screen gingham background image */
            background-color: #8c2848;
            background-image: url('./Bg1-page2.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: 100% 100%;

            padding: 20px;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-sticker {
            width: 160px;
            height: auto;
            display: block;
            margin-bottom: 25px;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
        }

        h2 {
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 25px;
            line-height: 1.4;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 50px;
            width: 100%;
            position: relative;
        }

        /* Completely transparent glassmorphism buttons with zero fill color */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 12px;
            background: transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn-yes:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-no {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .gif-frame {
            width: 100%;
            max-width: 240px;
            height: auto;
            margin: 0 auto 20px auto;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
            display: block;
            background: rgba(255, 255, 255, 0.9);
        }

        .btn-surprise {
            background: transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-size: 14px;
            padding: 12px 20px;
            margin-top: 15px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <img src="sticker2.jpg" alt="Sticker" class="top-sticker">

        <h2>First tell me do you love me?</h2>
        
        <div class="btn-container">
            <button class="btn btn-yes" id="yesBtn" onclick="sayYes()">Yes</button>
            <button class="btn btn-no" id="noBtn" onclick="handleNoClick()">No</button>
        </div>
    </div>

    <script>
        const noMessages = [
            "No",
            "Pretty please, bubu? 🥺",
            "Really??",
            "Think again! 💭",
            "Dil todoge? 💔",
            "Maan jao na khutur babie 👉👈"
        ];

        let noClickCount = 0;
        let yesScale = 1;
        let noScale = 1;

        function handleNoClick() {
            noClickCount++;
            
            const messageIndex = Math.min(noClickCount, noMessages.length - 1);
            document.getElementById('noBtn').innerText = noMessages[messageIndex];

            yesScale += 0.2;
            document.getElementById('yesBtn').style.transform = `scale(${yesScale})`;

            if (noScale > 0.4) {
                noScale -= 0.1;
                document.getElementById('noBtn').style.transform = `scale(${noScale})`;
            }
        }

        function sayYes() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <img src="Love1.gif" alt="Cute GIF" class="gif-frame">
                <h2>I knew it my khuchupuchu, I love you tooo&lt;3 💋</h2>
                <a href="page3.html" class="btn btn-surprise">🙈 Click for more surprises, Bubu.</a>
            `;
        }
    </script>
</body>
</html>
