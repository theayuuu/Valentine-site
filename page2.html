<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me? 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Balanced soft romantic maroon/rose gingham pattern */
            background-color: #8c2848;
            background-image: 
                linear-gradient(90deg, rgba(168, 50, 84, 0.4) 50%, transparent 50%),
                linear-gradient(rgba(168, 50, 84, 0.4) 50%, transparent 50%);
            background-size: 32px 32px;
            padding: 20px;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-sticker {
            width: 170px;
            height: auto;
            display: block;
            margin-bottom: 25px;
        }

        .card {
            background: #800f30;
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h2 {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 25px;
            line-height: 1.35;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 50px;
        }

        .btn {
            padding: 10px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .btn-yes {
            background-color: #ff4d6d;
            color: white;
        }

        .btn-no {
            background-color: #68102a;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .gif-frame {
            width: 100%;
            max-width: 240px;
            height: auto;
            margin: 0 auto 20px auto;
            border-radius: 16px;
            border: 3px solid #800f30;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
            display: block;
            background: #fff;
        }

        .btn-surprise {
            background-color: #ff4d6d;
            color: white;
            font-size: 15px;
            padding: 12px 20px;
            margin-top: 15px;
            border-radius: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <img src="sticker2.jpg" alt="Sticker" class="top-sticker">

        <div class="card">
            <h2>First tell me do you love me?</h2>
            
            <div class="btn-container">
                <button class="btn btn-yes" id="yesBtn" onclick="sayYes()">Yes</button>
                <button class="btn btn-no" id="noBtn" onclick="handleNoClick()">No</button>
            </div>
        </div>
    </div>

    <script>
        const noMessages = [
            "No",
            "Pretty please, bubu? 🥺",
            "Really??",
            "Think again! 💭",
            "Dil todoge? 💔",
            "Maan jao na khutur babie 👉👈"
        ];

        let noClickCount = 0;
        let yesScale = 1;
        let noScale = 1;

        function handleNoClick() {
            noClickCount++;
            
            const messageIndex = Math.min(noClickCount, noMessages.length - 1);
            document.getElementById('noBtn').innerText = noMessages[messageIndex];

            yesScale += 0.2;
            document.getElementById('yesBtn').style.transform = `scale(${yesScale})`;

            if (noScale > 0.4) {
                noScale -= 0.1;
                document.getElementById('noBtn').style.transform = `scale(${noScale})`;
            }
        }

        function sayYes() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="card">
                    <img src="Love1.gif" alt="Cute GIF" class="gif-frame">
                    <h2>I knew it my khuchupuchu, I love you tooo&lt;3 💋</h2>
                    <a href="page3.html" class="btn btn-surprise">🙈 Click for more surprises, Bubu.</a>
                </div>
            `;
        }
    </script>
</body>
</html>
