<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songs That Remind Me Of You 🎵</title>
    <!-- Importing Poppins Font only for a clean, simple look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;

            /* Full screen uploaded background image */
            background-color: #8c2848;
            background-image: url('./Bg1-page3.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;

            padding: 40px 20px 40px 20px;
            color: #fff;
            overflow-y: auto;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Simple straight heading with exact color #720D35 */
        h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 20px;
            color: #720D35;
            white-space: nowrap;
            margin-bottom: 25px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.4);
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-bottom: 12px;
        }

        /* Identical uniform button style for ALL buttons (Songs & Next Page) */
        .uniform-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 20px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 500;
            border-radius: 14px;
            background: rgba(105, 13, 45, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: transform 0.15s ease, background-color 0.2s ease;
        }

        .uniform-btn:active {
            transform: scale(0.98);
            background: rgba(105, 13, 45, 0.65);
        }

        @media (max-width: 360px) {
            h1 {
                font-size: 18px;
            }
            .uniform-btn {
                padding: 12px 16px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Some songs that remind me of you 🧿</h1>

        <div class="song-list">
            <a href="Songaudio1.html" class="uniform-btn">Song 1</a>
            <a href="Songaudio2.html" class="uniform-btn">Song 2</a>
            <a href="Songaudio3.html" class="uniform-btn">Song 3</a>
            <a href="Songaudio4.html" class="uniform-btn">Song 4</a>
            <a href="Songaudio5.html" class="uniform-btn">Song 5</a>
            <a href="Songaudio6.html" class="uniform-btn">Song 6</a>
            <a href="Songaudio7.html" class="uniform-btn">Song 7</a>
            <a href="Songaudio8.html" class="uniform-btn">Song 8</a>
            <a href="Songaudio9.html" class="uniform-btn">Song 9</a>
            <a href="Songaudio10.html" class="uniform-btn">Song 10</a>
        </div>

        <a href="page4.html" class="uniform-btn">Next page 🙈</a>
    </div>

</body>
</html>
