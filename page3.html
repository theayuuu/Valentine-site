<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox - Valentine's Surprise</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Meddon&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            min-height: 100vh;
            background: url('bg-pattern.jpg') repeat;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            padding: 25px 15px;
            position: relative;
        }

        /* Ambient background overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 182, 193, 0.3) 0%, rgba(128, 15, 48, 0.15) 100%);
            z-index: 1;
        }

        .main-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 340px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Single line, top header text */
        h1 {
            font-family: 'Meddon', cursive;
            font-size: 14px;
            color: #590d22;
            margin-bottom: 30px;
            white-space: nowrap;
            font-weight: normal;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        .icon-box {
            width: 50px;
            height: 50px;
            background: rgba(255, 204, 213, 0.85);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(128, 15, 48, 0.15);
            backdrop-filter: blur(4px);
        }

        .icon-box svg {
            width: 24px;
            height: 24px;
            fill: #800f30;
        }

        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .song-btn {
            width: 100%;
            padding: 15px;
            background-color: #800f30;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 500;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(128, 15, 48, 0.25);
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .song-btn:active {
            transform: scale(0.97);
            background-color: #590d22;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: rgba(128, 15, 48, 0.2);
            margin: 20px 0;
            position: relative;
        }

        .divider::after {
            content: '✨';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 0 8px;
            font-size: 12px;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #800f30;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="main-content">
        <!-- Single line top header -->
        <h1>Some songs that remind me of you ♥️</h1>

        <!-- Music Icon -->
        <div class="icon-box">
            <svg viewBox="0 0 24 24">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
        </div>

        <!-- Song Buttons -->
        <div class="btn-group">
            <a href="song1.html" class="song-btn">Song 1</a>
            <a href="song2.html" class="song-btn">Song 2</a>
        </div>

        <div class="divider"></div>

        <!-- Next Page Button -->
        <div class="btn-group">
            <a href="page4.html" class="song-btn">Next surprise 🙈</a>
        </div>

        <!-- Footer -->
        <div class="footer-text">Made with love • Jukebox</div>
    </div>

</body>
</html>
