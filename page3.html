<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox - Valentine's Surprise</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Meddon&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            min-height: 100vh;
            background: url('bg-pattern.jpg') repeat;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            padding: 25px 15px;
            position: relative;
        }

        /* Heart pattern background overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 182, 193, 0.3) 0%, rgba(128, 15, 48, 0.15) 100%);
            z-index: 1;
        }

        .main-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 340px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Cursive Header */
        h1 {
            font-family: 'Meddon', cursive;
            font-size: 14px;
            color: #590d22;
            margin-bottom: 15px;
            white-space: nowrap;
            font-weight: normal;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        /* Top Sticker with Maroon Outline/Border */
        .header-sticker {
            width: 110px;
            height: auto;
            margin-bottom: 25px;
            border-radius: 18px;
            border: 2px solid #800f30;
            box-shadow: 0 0 10px rgba(128, 15, 48, 0.3);
            display: block;
        }

        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .song-btn {
            width: 100%;
            padding: 14px;
            background-color: #800f30;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 500;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(128, 15, 48, 0.25);
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .song-btn:active {
            transform: scale(0.97);
            background-color: #590d22;
        }

        /* Simple Divider Line */
        .divider {
            width: 100%;
            height: 1px;
            background: rgba(128, 15, 48, 0.25);
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="main-content">
        <!-- Single Line Cursive Header -->
        <h1>Some songs that remind me of you ♥️</h1>

        <!-- Sticker Just Below Heading -->
        <img src="Sticker3.jpg" alt="Cute Sticker" class="header-sticker">

        <!-- 6 Song Buttons Linked -->
        <div class="btn-group">
            <a href="Songaudio1.html" class="song-btn">Song 1 🎵</a>
            <a href="Songaudio2.html" class="song-btn">Song 2 🎵</a>
            <a href="Songaudio3.html" class="song-btn">Song 3 🎵</a>
            <a href="Songaudio4.html" class="song-btn">Song 4 🎵</a>
            <a href="Songaudio5.html" class="song-btn">Song 5 🎵</a>
            <a href="Songaudio6.html" class="song-btn">Song 6 🎵</a>
        </div>

        <!-- Plain Soft Line Divider -->
        <div class="divider"></div>

        <!-- Next Page Button -->
        <div class="btn-group">
            <a href="page4.html" class="song-btn">Next surprise 🙈</a>
        </div>
    </div>

</body>
</html>
