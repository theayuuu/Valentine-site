<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Special Date - Page 4</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            min-height: 100vh;
            background: url('bg-pattern.jpg') repeat;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }

        /* Outer White Card Container */
        .card-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 340px;
            border-radius: 28px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(128, 15, 48, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .sticker {
            width: 100px;
            height: auto;
            margin-bottom: 15px;
            border-radius: 16px;
        }

        h2 {
            color: #800f30;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .sub-text {
            color: #b3526d;
            font-size: 12px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* Date Slots for Numbers */
        .slots-wrapper {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            min-height: 36px;
        }

        .slot {
            width: 26px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #800f30;
            border-bottom: 2px solid #f0c2cd;
            transition: all 0.2s ease;
        }

        .slot.filled {
            border-bottom-color: #800f30;
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }

        /* Numpad Layout */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .key {
            background-color: #fce8ed;
            color: #800f30;
            border: none;
            border-radius: 20px;
            padding: 14px 0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(128, 15, 48, 0.05);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .key:active {
            background-color: #800f30;
            color: #ffffff;
            transform: scale(0.95);
        }

        .key.clear-btn {
            font-size: 12px;
            background-color: transparent;
            color: #b3526d;
            box-shadow: none;
        }

        .key.back-btn {
            background-color: transparent;
            color: #b3526d;
            box-shadow: none;
            font-size: 16px;
        }

        /* Error message styling */
        .error-msg {
            color: #e63946;
            font-size: 12px;
            margin-top: 12px;
            height: 18px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Sticker -->
        <img id="mainSticker" src="Sticker4.jpg" alt="Cute Sticker" class="sticker">

        <!-- Title & Subtitle -->
        <h2>Enter the Special Date</h2>
        <p class="sub-text">When we talked for the first time</p>

        <!-- 8 Slots (For DDMMYYYY) -->
        <div class="slots-wrapper" id="slotsWrapper">
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
        </div>

        <!-- Numpad Grid -->
        <div class="numpad">
            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2</button>
            <button class="key" onclick="pressKey('3')">3</button>
            <button class="key" onclick="pressKey('4')">4</button>
            <button class="key" onclick="pressKey('5')">5</button>
            <button class="key" onclick="pressKey('6')">6</button>
            <button class="key" onclick="pressKey('7')">7</button>
            <button class="key" onclick="pressKey('8')">8</button>
            <button class="key" onclick="pressKey('9')">9</button>
            <button class="key clear-btn" onclick="clearAll()">Clear</button>
            <button class="key" onclick="pressKey('0')">0</button>
            <button class="key back-btn" onclick="backspace()">⌫</button>
        </div>

        <div class="error-msg" id="errorMsg"></div>
    </div>

    <script>
        // Set your correct date here (Format: DDMMYYYY, total 8 digits, e.g., "14022024")
        const CORRECT_DATE = "14022024"; 
        const MAX_DIGITS = CORRECT_DATE.length;

        let currentInput = "";
        const slots = document.querySelectorAll('.slot');
        const errorMsg = document.getElementById('errorMsg');

        function updateSlots() {
            slots.forEach((slot, index) => {
                if (index < currentInput.length) {
                    slot.innerText = currentInput[index];
                    slot.classList.add('filled');
                } else {
                    slot.innerText = "";
                    slot.classList.remove('filled');
                }
            });
        }

        function pressKey(digit) {
            if (currentInput.length < MAX_DIGITS) {
                currentInput += digit;
                errorMsg.innerText = "";
                updateSlots();

                if (currentInput.length === MAX_DIGITS) {
                    checkCode();
                }
            }
        }

        function backspace() {
            if (currentInput.length > 0) {
                currentInput = currentInput.slice(0, -1);
                errorMsg.innerText = "";
                updateSlots();
            }
        }

        function clearAll() {
            currentInput = "";
            errorMsg.innerText = "";
            updateSlots();
        }

        function checkCode() {
            if (currentInput === CORRECT_DATE) {
                window.location.href = "page5.html";
            } else {
                errorMsg.innerText = "Oops! Wrong date, try again 🙈";
                setTimeout(() => {
                    clearAll();
                }, 1000);
            }
        }
    </script>
</body>
</html>
