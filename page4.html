<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Special Date - Page 4</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            min-height: 100vh;
            /* Pure CSS Polka Dot Pattern Background matching the uploaded image */
            background-color: #f7b2bd;
            background-image: radial-gradient(#800f30 15%, transparent 16%),
                              radial-gradient(#800f30 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }

        /* Outer White Card Container */
        .card-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 340px;
            border-radius: 28px;
            padding: 28px 20px 22px 20px;
            box-shadow: 0 15px 35px rgba(128, 15, 48, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .sticker {
            width: 100px;
            height: auto;
            margin-bottom: 12px;
            border-radius: 16px;
        }

        h2 {
            color: #800f30;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        /* Temporary Hint Text Box */
        .hint-text-box {
            min-height: 22px;
            color: #800f30;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
            display: none;
        }

        /* Date Slots for Underscores & Numbers */
        .slots-wrapper {
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
            margin-bottom: 22px;
            min-height: 36px;
        }

        .slot {
            width: 24px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #800f30;
            border-bottom: 2px solid #800f30;
            transition: all 0.2s ease;
        }

        /* Numpad Layout */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }

        .key {
            background-color: #fce8ed;
            color: #800f30;
            border: none;
            border-radius: 20px;
            padding: 14px 0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(128, 15, 48, 0.05);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .key:active {
            background-color: #800f30;
            color: #ffffff;
            transform: scale(0.95);
        }

        .key.clear-btn {
            font-size: 12px;
            background-color: transparent;
            color: #b3526d;
            box-shadow: none;
        }

        .key.back-btn {
            background-color: transparent;
            color: #b3526d;
            box-shadow: none;
            font-size: 16px;
        }

        /* Medium Sized Action Buttons Area (Try Again / Hint 🙈) */
        .action-btn-area {
            min-height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .custom-action-btn {
            background-color: #fce8ed;
            color: #800f30;
            border: 2px solid #800f30;
            border-radius: 22px;
            padding: 9px 28px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            display: none;
            box-shadow: 0 4px 10px rgba(128, 15, 48, 0.1);
        }

        .custom-action-btn:active {
            background-color: #800f30;
            color: #ffffff;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Sticker -->
        <img id="mainSticker" src="Sticker4.jpg" alt="Cute Sticker" class="sticker">

        <!-- Title -->
        <h2>Enter our special date.</h2>

        <!-- Hint Text Box (Hidden initially) -->
        <div id="hintTextBox" class="hint-text-box">When we talked for the first time</div>

        <!-- 8 Slots (For DDMMYYYY) -->
        <div class="slots-wrapper" id="slotsWrapper">
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
        </div>

        <!-- Numpad Grid -->
        <div class="numpad">
            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2</button>
            <button class="key" onclick="pressKey('3')">3</button>
            <button class="key" onclick="pressKey('4')">4</button>
            <button class="key" onclick="pressKey('5')">5</button>
            <button class="key" onclick="pressKey('6')">6</button>
            <button class="key" onclick="pressKey('7')">7</button>
            <button class="key" onclick="pressKey('8')">8</button>
            <button class="key" onclick="pressKey('9')">9</button>
            <button class="key clear-btn" onclick="clearAll()">Clear</button>
            <button class="key" onclick="pressKey('0')">0</button>
            <button class="key back-btn" onclick="backspace()">⌫</button>
        </div>

        <!-- Action Button Area (Try Again / Hint) -->
        <div class="action-btn-area">
            <button id="tryAgainBtn" class="custom-action-btn" onclick="handleTryAgain()">Try Again</button>
            <button id="hintBtn" class="custom-action-btn" onclick="showHint()">Hint 🙈</button>
        </div>
    </div>

    <script>
        // Set your correct date here (Format: DDMMYYYY, e.g., "14022024")
        const CORRECT_DATE = "14022024"; 
        const MAX_DIGITS = CORRECT_DATE.length;

        let currentInput = "";
        let wrongAttempts = 0;

        const slots = document.querySelectorAll('.slot');
        const tryAgainBtn = document.getElementById('tryAgainBtn');
        const hintBtn = document.getElementById('hintBtn');
        const hintTextBox = document.getElementById('hintTextBox');

        function updateSlots() {
            slots.forEach((slot, index) => {
                if (index < currentInput.length) {
                    slot.innerText = currentInput[index];
                } else {
                    slot.innerText = "";
                }
            });
        }

        function pressKey(digit) {
            if (currentInput.length < MAX_DIGITS) {
                currentInput += digit;
                updateSlots();

                if (currentInput.length === MAX_DIGITS) {
                    checkCode();
                }
            }
        }

        function backspace() {
            if (currentInput.length > 0) {
                currentInput = currentInput.slice(0, -1);
                updateSlots();
            }
        }

        function clearAll() {
            currentInput = "";
            updateSlots();
        }

        function checkCode() {
            if (currentInput === CORRECT_DATE) {
                window.location.href = "page5.html";
            } else {
                wrongAttempts++;
                
                // Show Try Again or Hint Button based on attempts
                if (wrongAttempts >= 2) {
                    tryAgainBtn.style.display = "none";
                    hintBtn.style.display = "inline-block";
                } else {
                    tryAgainBtn.style.display = "inline-block";
                    hintBtn.style.display = "none";
                }
            }
        }

        function handleTryAgain() {
            clearAll();
            tryAgainBtn.style.display = "none";
        }

        function showHint() {
            hintBtn.style.display = "none";
            hintTextBox.style.display = "block";
            clearAll();

            // Disappear after 2 seconds
            setTimeout(() => {
                hintTextBox.style.display = "none";
            }, 2000);
        }
    </script>
</body>
</html>
