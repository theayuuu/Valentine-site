<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Letter 💌</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Full page background with uploaded hearts pattern */
        body {
            background-color: #8c2848;
            background-image: url('./Bg1-page3.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Container matching the black box marked area in reference image */
        .letter-container {
            position: relative;
            width: 100%;
            max-width: 360px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Display the original letter cover image */
        .letter-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }

        /* Invisible Button exactly over the printed red heart wax seal */
        .invisible-seal-btn {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: transparent;
            border: none;
            cursor: pointer;
            text-decoration: none;
            /* Optional subtle active tap highlight */
            -webkit-tap-highlight-color: rgba(255, 255, 255, 0.2);
        }

        .invisible-seal-btn:active {
            transform: translate(-50%, -50%) scale(0.92);
        }
    </style>
</head>
<body>

    <div class="letter-container">
        <!-- Original Letter Cover Image -->
        <img src="./Loveletteroriginal.jpg" alt="Love Letter Cover" class="letter-img">
        
        <!-- Invisible Clickable Hotspot over the printed Wax Seal linking to Page 6 -->
        <a href="page6.html" class="invisible-seal-btn" title="Open Letter"></a>
    </div>

</body>
</html>
