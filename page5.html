<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Cover 💌</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Full page background with the rosy/kiss print image */
        body {
            background-color: #8c2848;
            background-image: url('./Bg1-page3.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Envelope Image Container (Compact frame in center) */
        .envelope-card {
            position: relative;
            width: 100%;
            max-width: 360px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Love letter image filling the card */
        .envelope-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 16px;
        }

        /* Invisible clickable button placed exactly over the red heart seal */
        .invisible-seal-btn {
            position: absolute;
            bottom: 30.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
        }

        /* Active feedback effect */
        .invisible-seal-btn:active {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <div class="envelope-card">
        <!-- Updated envelope cover image filename -->
        <img src="./Loveletteroriginal.jpg" alt="Love Letter Envelope" class="envelope-img">

        <!-- Invisible circle button over the heart seal linking to Page 6 -->
        <a href="page6.html" class="invisible-seal-btn" title="Open Page 6"></a>
    </div>

</body>
</html>
