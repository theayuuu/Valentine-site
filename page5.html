<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Cover 💌</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Background image */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #8c2848;
            background-image: url('./Bg1-page3.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Instruction text above the envelope */
        .tap-instruction {
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 22px;
            text-align: center;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
            animation: bounce 1.8s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Wrapper containing the letter image and the interactive heart seal button */
        .letter-wrapper {
            position: relative;
            width: 100%;
            max-width: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.35));
        }

        /* The uploaded letter image (Loveletteroriginal.jpg) */
        .letter-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }

        /* Invisible clickable button precisely positioned over the heart seal */
        .heart-seal-btn {
            position: absolute;
            top: 56.5%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 10;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <!-- Instruction Text -->
    <div class="tap-instruction">Tap the seal to open the letter 💌</div>

    <!-- Letter Image with Interactive Seal Button -->
    <div class="letter-wrapper">
        <img src="./Loveletteroriginal.jpg" alt="Love Letter" class="letter-img">
        <a href="page6.html" class="heart-seal-btn" title="Open Letter"></a>
    </div>

</body>
</html>
