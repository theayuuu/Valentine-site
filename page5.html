<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Cover 💌</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #8c2848;
      background-image: url("./Bg1-page3.jpg");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Letter image only — no box or border */
    .letter-img {
      display: block;
      width: min(78vw, 360px);
      max-height: 80dvh;
      height: auto;
      object-fit: contain;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }

    /* Invisible clickable area over the heart seal */
    .letter-wrap {
      position: relative;
      display: inline-block;
      line-height: 0;
    }

    .heart-seal-btn {
      position: absolute;
      top: 51%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 55px;
      height: 55px;
      background: transparent;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body>

  <div class="letter-wrap">
    <img
      src="./Loveletteroriginal.jpg"
      alt="Love Letter"
      class="letter-img"
    >

    <a
      href="page6.html"
      class="heart-seal-btn"
      aria-label="Open the love letter"
      title="Open Letter"
    ></a>
  </div>

</body>
</html>
