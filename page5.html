<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Cover 💌</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Background: 1st image (Bg1-page3.jpg) */
        body {
            background-color: #8c2848;
            background-image: url('./Bg1-page3.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container holding the letter image and the interactive heart seal button */
        .letter-container {
            position: relative;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The uploaded letter image (Loveletteroriginal.jpg) */
        .letter-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }

        /* Invisible clickable button precisely positioned over the heart seal */
        .heart-seal-btn {
            position: absolute;
            /* Adjust these percentages if needed based on exact heart position on the image */
            top: 51%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55px;
            height: 55px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 10;
            border-radius: 50%;
        }

        /* Optional subtle hover effect to feel responsive */
        .heart-seal-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <div class="letter-container">
        <!-- Letter original image -->
        <img src="./Loveletteroriginal.jpg" alt="Love Letter" class="letter-img">

        <!-- Invisible button right over the heart seal linking to page6.html -->
        <a href="page6.html" class="heart-seal-btn" title="Open Letter"></a>
    </div>

</body>
</html>
