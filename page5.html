<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Cover 💌</title>
    <!-- Fonts matching the vintage photo style: Cursive for Main Title, Typewriter for From/To -->
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Courier Prime', monospace;
        }

        /* Full Screen Vintage Envelope Container */
        body {
            background-color: #f4eae1;
            /* Vintage parchment texture background */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(244, 234, 225, 0.8), rgba(218, 198, 178, 0.9)),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .envelope-cover {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 92vh;
            max-height: 720px;
            background: #f7eee4;
            /* Matching deep maroon outline border */
            border: 3px solid #6b1d28;
            box-shadow: inset 0 0 30px rgba(107, 29, 40, 0.12), 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 20px;
            overflow: hidden;
        }

        /* Vintage V-Shape Flap Overlay Lines */
        .v-flap-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 48%;
            pointer-events: none;
        }

        .v-flap-lines svg {
            width: 100%;
            height: 100%;
        }

        /* Top Header Details: FROM (Left) & TO (Right) */
        .envelope-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 2;
            color: #5a141e;
            font-size: 13px;
            line-height: 1.5;
            font-weight: 700;
        }

        .from-section {
            text-align: left;
            text-transform: uppercase;
        }

        .to-section {
            text-align: right;
            text-transform: uppercase;
        }

        /* Center Content: Main Cursive Title & Subtitle */
        .envelope-center {
            text-align: center;
            z-index: 2;
            margin-top: -30px;
        }

        .main-cursive-title {
            font-family: 'Alex Brush', cursive;
            font-size: 52px;
            color: #6b1d28;
            line-height: 1.1;
            margin-bottom: 5px;
            text-shadow: 0 1px 1px rgba(107, 29, 40, 0.15);
        }

        .sub-flap-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 18px;
            color: #6b1d28;
            letter-spacing: 0.5px;
        }

        /* Wax Seal Button at V-Flap Point */
        .seal-container {
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
            margin-bottom: 40px;
        }

        .wax-seal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #8c2848, #5a141e 80%);
            border: 2px solid #3d0a13;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.3);
            color: #f7eee4;
            font-size: 28px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .wax-seal-btn:active {
            transform: scale(0.92);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        /* Responsive adjustments for mobile screens */
        @media (max-width: 400px) {
            .envelope-header {
                font-size: 11px;
            }
            .main-cursive-title {
                font-size: 42px;
            }
            .sub-flap-text {
                font-size: 16px;
            }
            .wax-seal-btn {
                width: 64px;
                height: 64px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="envelope-cover">
        
        <!-- V-Flap Vintage SVG Outline Overlay -->
        <div class="v-flap-lines">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="M0,0 L50,85 L100,0" fill="none" stroke="#6b1d28" stroke-width="0.8" opacity="0.4" />
                <path d="M0,0 L50,86 L100,0" fill="none" stroke="#5a141e" stroke-width="0.4" opacity="0.2" />
            </svg>
        </div>

        <!-- Top Header Details -->
        <div class="envelope-header">
            <div class="from-section">
                <div>FROM: Putur Babiee</div>
                <div>Date: 14-02</div>
                <div>Putur's heart</div>
            </div>
            <div class="to-section">
                <div>TO: My only khutur babie.</div>
            </div>
        </div>

        <!-- Center Cursive Title & Subheading -->
        <div class="envelope-center">
            <h1 class="main-cursive-title">Letter for my khutur</h1>
            <div class="sub-flap-text">Happy Valentines</div>
        </div>

        <!-- Maroon Wax Seal Button linking to Page 6 -->
        <div class="seal-container">
            <a href="page6.html" class="wax-seal-btn" title="Open Letter">💌</a>
        </div>

    </div>

</body>
</html>
