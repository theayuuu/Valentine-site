<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You 💌</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      background-color: #8c2848;
      background-image: url("./Bg1-page3.jpg");
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Instruction text above the letter */
    .instruction {
      position: fixed;
      top: 28%;
      left: 0;
      width: 100%;
      padding: 0 12px;

      text-align: center;
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.4;

      text-shadow: 0 1px 5px rgba(90, 20, 40, 0.35);
      z-index: 5;
    }

    /* Letter only — no extra container styling */
    .letter-wrap {
      position: relative;
      display: inline-block;
      width: min(84vw, 400px);
      max-height: 78dvh;
      margin: 0;
      padding: 0;

      background: transparent;
      border: none;
      box-shadow: none;
    }

    .letter-img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 78dvh;
      object-fit: contain;

      border: none;
      border-radius: 0;
      box-shadow: none;

      /* Thin maroon outline around the letter */
      outline: 2px solid #70132f;
      outline-offset: 3px;
    }

    /* Invisible clickable area over the heart seal */
    .heart-seal-btn {
      position: absolute;
      top: 51%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 55px;
      height: 55px;

      display: block;
      background: transparent;
      border: none;
      border-radius: 50%;
      box-shadow: none;
      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
      z-index: 2;
    }

    @media (max-height: 650px) {
      .instruction {
        top: 18%;
        font-size: 16px;
      }

      .letter-wrap,
      .letter-img {
        max-height: 65dvh;
      }
    }
  </style>
</head>

<body>

  <p class="instruction">
    Tap the seal to open the letter 💌
  </p>

  <div class="letter-wrap">

    <img
      src="./Loveletteroriginal.jpg"
      alt="Love letter"
      class="letter-img"
    >

    <a
      href="page6.html"
      class="heart-seal-btn"
      aria-label="Open the letter"
      title="Open Letter"
    ></a>

  </div>

</body>
</html>
