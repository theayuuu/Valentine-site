<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Cover 💌</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Full page background with the rosy/kiss print image */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #8c2848 !important;
            background-image: url('./Bg1-page3.jpg') !important;
            background-repeat: no-repeat !important;
            background-position: center center !important;
            background-size: cover !important;
            background-attachment: fixed !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Minimal font heading above the letter */
        .tap-heading {
            font-size: 15px;
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            background: transparent !important;
            box-shadow: none !important;
        }

        /* Pure image container without any background box */
        .letter-wrapper {
            position: relative;
            width: 100%;
            max-width: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent !important;
            background-color: transparent !important;
            box-shadow: none !important;
            border: none !important;
        }

        /* Love letter image with maroon outline border */
        .envelope-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            border: 3px solid #5a141e;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        /* Invisible clickable button placed exactly over the red heart seal */
        .invisible-seal-btn {
            position: absolute;
            bottom: 30.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
        }

        .invisible-seal-btn:active {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Minimal heading -->
    <div class="tap-heading">Tap the seal to open the letter 🙈</div>

    <div class="letter-wrapper">
        <!-- Letter image with maroon border -->
        <img src="./Loveletteroriginal.jpg" alt="Love Letter Envelope" class="envelope-img">

        <!-- Invisible button over the heart seal linking to Page 6 -->
        <a href="page6.html" class="invisible-seal-btn" title="Open Page 6"></a>
    </div>

</body>
</html>
