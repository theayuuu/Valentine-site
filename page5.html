<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Cover 💌</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Background image */
        body {
            background-color: #8c2848;
            background-image: url('./Bg1-page3.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* Direct Letter Image */
        .letter-img {
            width: 100%;
            max-width: 360px;
            height: auto;
            display: block;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        /* Invisible clickable button over the heart seal */
        .heart-seal-btn {
            position: absolute;
            top: 51%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55px;
            height: 55px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 10;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <!-- Direct image with the clickable button -->
    <div style="position: relative; display: inline-block; width: 100%; max-width: 360px; text-align: center;">
        <img src="./Loveletteroriginal.jpg" alt="Love Letter" class="letter-img">
        <a href="page6.html" class="heart-seal-btn" title="Open Letter"></a>
    </div>

</body>
</html>
