<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Letter 💌</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #c58e98;
      background-image: url('./Bg1-page3.jpg');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      background-attachment: fixed;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      gap: 36px;
    }

    /* Minimal instruction text */
    .instruction {
      color: #fffaf8;
      font-family: 'Poppins', sans-serif;
      font-size: clamp(17px, 4.5vw, 24px);
      font-weight: 400;
      text-align: center;
      line-height: 1.5;
      text-shadow: 0 1px 5px rgba(90, 20, 40, 0.12);
    }

    /* Envelope only — no extra box */
    .letter-wrap {
      position: relative;
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .letter-img {
      display: block;
      width: 100%;
      height: auto;
      border: 2px solid #762039;
      border-radius: 5px;
      box-shadow: 0 8px 22px rgba(91, 20, 42, 0.20);
    }

    /* Invisible clickable area over the wax seal */
    .heart-seal-btn {
      position: absolute;
      top: 51%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 18%;
      height: 20%;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }

    .heart-seal-btn:focus-visible {
      outline: 2px solid #762039;
      outline-offset: 4px;
    }

    @media (max-width: 400px) {
      body {
        gap: 30px;
        padding: 24px 16px;
      }

      .letter-wrap {
        max-width: 100%;
      }
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap"
        rel="stylesheet">
</head>

<body>

  <p class="instruction">
    Tap the seal to open the letter 💌
  </p>

  <div class="letter-wrap">
    <img
      src="./Loveletteroriginal.jpg"
      alt="A sealed love letter"
      class="letter-img"
    >

    <a
      href="page6.html"
      class="heart-seal-btn"
      aria-label="Open the love letter"
      title="Open Letter"
    ></a>
  </div>

</body>
</html>
