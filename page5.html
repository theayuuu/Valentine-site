<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Cover 💌</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Full page background with the rosy/kiss print image */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #8c2848;
            background-image: url('./Bg1-page3.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Minimal font heading above the letter */
        .tap-heading {
            font-size: 15px;
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 18px;
            text-align: center;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        /* Letter wrapper without any background box */
        .letter-wrapper {
            position: relative;
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            box-shadow: none;
        }

        /* Love letter image */
        .envelope-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        /* Invisible clickable button placed exactly over the red heart seal */
        .invisible-seal-btn {
            position: absolute;
            bottom: 30.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
        }

        .invisible-seal-btn:active {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <!-- Minimal heading -->
    <div class="tap-heading">Tap the seal to open the letter 🙈</div>

    <div class="letter-wrapper">
        <!-- Letter image -->
        <img src="./Loveletteroriginal.jpg" alt="Love Letter Envelope" class="envelope-img">

        <!-- Invisible button over the heart seal linking to Page 6 -->
        <a href="page6.html" class="invisible-seal-btn" title="Open Page 6"></a>
    </div>

</body>
</html>
